# Servidor de teste no modo de muitos FortiGate: o servidor se prova por PSK e o usuário entra por EAP.
connections {
  rw {
    version = 2
    local_addrs = %any
    pools = pool
    send_certreq = no
    local {
      auth = psk
      id = gateway
    }
    remote {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      net {
        local_ts = 0.0.0.0/0
      }
    }
  }
}

pools {
  pool {
    addrs = 10.10.10.0/24
  }
}

secrets {
  # Só para teste. Sem "id": vale para qualquer par.
  ike-psk {
    secret = "psk-de-teste-iron-gate"
  }
  eap-maria {
    id = maria
    secret = senha123
  }
}
