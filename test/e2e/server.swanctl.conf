connections {
  rw {
    version = 2
    local_addrs = %any
    pools = pool
    send_certreq = no
    local {
      auth = pubkey
      certs = server.pem
      id = gateway
    }
    remote {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      net {
        local_ts = 0.0.0.0/0
      }
    }
  }
}

pools {
  pool {
    addrs = 10.10.10.0/24
  }
}

secrets {
  eap-maria {
    id = maria
    secret = senha123
  }
}
