name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: go vet ./...
      - run: go vet -tags "desktop,production,webkit2_41" ./gui
      - run: go test ./...

  e2e:
    name: Conexão ponta a ponta (strongSwan em Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Servidor e cliente de teste
        run: docker compose -f test/e2e/docker-compose.yml up --build --abort-on-container-exit --exit-code-from client
